name: PlatformIO CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build esp32release
        run: pio run -e esp32release

      - name: Build d1mini
        run: pio run -e d1mini

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/esp32release/firmware.bin
            .pio/build/d1mini/firmware.bin
          generate_release_notes: true
